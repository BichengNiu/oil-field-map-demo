name: Publish monitoring snapshot

'on':
  schedule:
    # GitHub cron is UTC: 08:00 and 13:00 in Asia/Dubai.
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Collect now or retry only if this primary window has no successful snapshot
        type: choice
        required: true
        default: retry
        options:
          - collect
          - retry

permissions:
  contents: write

concurrency:
  group: monitoring-snapshot-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out main without downloading historical LFS objects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          persist-credentials: true
      - name: Set up collector Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Configure the repository publisher identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect, validate, publish and verify through the existing entry point
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mode=collect
          if [[ "$EVENT_NAME" == schedule && "$SCHEDULE" == '0 9 * * *' ]]; then
            mode=retry
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            case "$REQUESTED_MODE" in
              collect|retry) mode="$REQUESTED_MODE" ;;
              *) echo 'Invalid collection mode.' >&2; exit 2 ;;
            esac
          fi
          args=()
          if [[ "$mode" == retry ]]; then args+=(--retry); fi
          mkdir -p runtime
          bash deploy/update_snapshot.sh "${args[@]}" 2>&1 | tee runtime/scheduled-run.log
